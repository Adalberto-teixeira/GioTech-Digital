<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page de contact — Template gratuit GioTech Digital</title>
  <meta name="description" content="Page de contact professionnelle avec formulaire, coordonnées et FAQ." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { padding-bottom: 0; }
    .standalone-wrap { padding: clamp(2.5rem, 6vw, 5rem) 0; }
    .page-view { display: block !important; text-align: center; }
  </style>
</head>
<body>
  <main class="container standalone-wrap">
    <div class="page-icon icon-contactpro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>
            <h1 style="font-size:clamp(1.8rem,4vw,2.4rem);">Sarah Klein</h1>
            <p>Consultante en stratégie digitale — disponible pour de nouveaux projets.</p>
            <div class="contactpro-mini">
              <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg> sarah.klein@exemple.fr</div>
              <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .7 3a2 2 0 0 1-.4 2.1L8 10.3a16 16 0 0 0 6 6l1.5-1.4a2 2 0 0 1 2.1-.4c1 .4 2 .6 3 .7a2 2 0 0 1 1.7 2Z"/></svg> +33 6 00 00 00 00</div>
              <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12 12 3l9 9M5 10v10h14V10"/></svg> Paris, France</div>
            </div>
            <div class="page-actions"><a href="#" class="btn btn-primary">Prendre rendez-vous</a></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/gsap.min.js"></script>
  <script>
    document.getElementById("le-year") && (document.getElementById("le-year").textContent = new Date().getFullYear());
    var target = new Date(Date.now() + (14 * 86400000) + (6 * 3600000));
    function tick() {
      var diff = target - new Date(); if (diff < 0) diff = 0;
      var d=document.getElementById("sc-days"), h=document.getElementById("sc-hours"), m=document.getElementById("sc-min"), s=document.getElementById("sc-sec");
      if (d) d.textContent = Math.floor(diff / 86400000);
      if (h) h.textContent = String(Math.floor((diff % 86400000) / 3600000)).padStart(2, "0");
      if (m) m.textContent = String(Math.floor((diff % 3600000) / 60000)).padStart(2, "0");
      if (s) s.textContent = String(Math.floor((diff % 60000) / 1000)).padStart(2, "0");
    }
    tick(); setInterval(tick, 1000);
    var soonForm = document.getElementById("soon-form");
    if (soonForm) soonForm.addEventListener("submit", function (e) { e.preventDefault(); document.getElementById("soon-success").classList.add("is-shown"); soonForm.reset(); });
    document.getElementById("order-date") && (document.getElementById("order-date").textContent = new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }));
  </script>
</body>
</html>
